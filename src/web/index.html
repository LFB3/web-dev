<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Server nutzungs statistiken">
    <title>Usages</title>
    <link rel="stylesheet" type="text/css" href="http://127.0.0.1:3000/style.css">
    <script src="http://127.0.0.1:3000/script.js" defer></script>
</head>

<body>
    <main>
        <p>CPU Auslastung: <span id="cpu">0%</span></p>
        <p>RAM Auslastung: <span id="ramUsed">0</span> / <span id="ramTotal">0</span> = <span id="ramPercentage">0</span>%</p>
        <p>Festplatten Auslastung: <span id="diskUsed">0</span> / <span id="diskTotal">0</span> = <span id="diskPercentage">0</span>% Dateisystem: <span id="diskFilesystem">btrfs</span></p>

        <table id="container">
            <thead>
                <th>Name</th>
                <th>Online seit</th>
                <th>CPU Nutzung</th>
                <th>Ram Nutzung</th>
                <th>Verkehr Ankommend</th>
                <th>Verkehr Ausgehend</th>
            </thead>
            <tbody>
                <tr>
                    <td>Testname</td>
                    <td>Seit anfang der zeit</td>
                    <td>alles</td>
                    <td>auch alles</td>
                    <td>100gb</td>
                    <td>1000tb</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
